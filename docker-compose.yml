# Infrastructure-only compose for local development.
# Ruby/Rails run on the host machine — only Postgres and Redis in Docker.
#
# Usage:
#   docker compose up -d          # start infra
#   bin/setup                     # install gems, prepare DB, start server
#   bundle exec rspec             # run tests
#
# For a fully containerized environment, use docker-compose.local.yml instead.

services:
  postgres:
    image: postgres:15
    container_name: orzeny-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orzeny_development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: orzeny-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:

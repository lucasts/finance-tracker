<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Solicitação inválida - Orzeny</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Solicitação inválida no sistema Orzeny - Clareza para suas finanças">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #F9F7F1;
      color: #1F2937;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orzeny-card {
      background: #FFFBF4;
      border-radius: 1.25rem;
      box-shadow: 0 4px 32px 0 rgba(60, 60, 60, 0.08);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .orzeny-logo {
      height: 64px;
      margin-bottom: 1.5rem;
    }
    .orzeny-title {
      color: #F87272;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .orzeny-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .orzeny-desc {
      color: #6B7280;
      margin-bottom: 2rem;
    }
    .orzeny-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .orzeny-btn {
      background: #3A6B65;
      color: #FFFBF4;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .orzeny-btn.outline {
      background: transparent;
      color: #3A6B65;
      border: 2px solid #3A6B65;
    }
    .orzeny-footer {
      color: #9CA3AF;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="orzeny-card">
    <img src="/full_logo_orzeny-min.png" alt="Orzeny" class="orzeny-logo">
    <div class="orzeny-icon">⚠️</div>
    <div class="orzeny-title">Solicitação inválida</div>
    <div class="orzeny-desc">A solicitação enviada não pôde ser processada devido a um erro do cliente.</div>
    <div class="orzeny-actions">
      <button class="orzeny-btn outline" onclick="history.back()">Voltar</button>
      <a href="/" class="orzeny-btn">Página inicial</a>
    </div>
    <div class="orzeny-footer">Erro 400 - Orzeny © 2025</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Erro interno - Zeno</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Erro interno no sistema Zeno - Clareza para suas finanças">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #F9F7F1;
      color: #1F2937;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zeno-card {
      background: #FFFBF4;
      border-radius: 1.25rem;
      box-shadow: 0 4px 32px 0 rgba(60, 60, 60, 0.08);
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .zeno-logo {
      height: 64px;
      margin-bottom: 1.5rem;
    }
    .zeno-title {
      color: #F87272;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .zeno-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .zeno-desc {
      color: #6B7280;
      margin-bottom: 2rem;
    }
    .zeno-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .zeno-btn {
      background: #3A6B65;
      color: #FFFBF4;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .zeno-btn.outline {
      background: transparent;
      color: #3A6B65;
      border: 2px solid #3A6B65;
    }
    .zeno-footer {
      color: #9CA3AF;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
    .zeno-help {
      background: #F3F0E8;
      color: #1F2937;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="zeno-card">
    <img src="/full_logo_zeno-min.png" alt="Zeno" class="zeno-logo">
    <div class="zeno-icon">⚠️</div>
    <div class="zeno-title">Erro interno</div>
    <div class="zeno-desc">Ops! Algo deu errado.<br>Ocorreu um erro interno no sistema. Nossa equipe foi notificada automaticamente e está trabalhando para resolver o problema o mais rápido possível.</div>
    <div class="zeno-actions">
      <button class="zeno-btn outline" onclick="location.reload()">Tentar novamente</button>
      <a href="/" class="zeno-btn">Voltar ao início</a>
    </div>
    <div class="zeno-help">
      Se o problema persistir, entre em contato com nosso suporte técnico.
    </div>
    <div class="zeno-footer">Erro 500 - Zeno © 2025</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline - Finance Tracker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 300;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 2rem;
    }
    
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    .online {
      color: #4ade80;
    }
    
    .offline {
      color: #f87171;
    }
    
    @media (max-width: 600px) {
      .actions {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Você está offline</h1>
    <p>
      Não foi possível conectar ao Finance Tracker. 
      Verifique sua conexão com a internet e tente novamente.
    </p>
    
    <div class="actions">
      <a href="/" class="btn btn-primary" onclick="window.location.reload()">
        Tentar Novamente
      </a>
      <a href="/cached-data" class="btn" id="cached-data-btn">
        Ver Dados Salvos
      </a>
    </div>
    
    <div class="status">
      <div id="connection-status">
        <span class="offline">● Offline</span>
      </div>
      <div>
        Alguns dados podem estar disponíveis no cache local
      </div>
    </div>
  </div>

  <script>
    // Monitor connection status
    function updateConnectionStatus() {
      const statusElement = document.getElementById('connection-status');
      if (navigator.onLine) {
        statusElement.innerHTML = '<span class="online">● Online</span>';
        // Auto-redirect when back online
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } else {
        statusElement.innerHTML = '<span class="offline">● Offline</span>';
      }
    }

    // Listen for connection changes
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    
    // Initial status check
    updateConnectionStatus();

    // Handle cached data button
    document.getElementById('cached-data-btn').addEventListener('click', function(e) {
      e.preventDefault();
      
      // Check if we have cached data available
      if ('caches' in window) {
        caches.match('/').then(response => {
          if (response) {
            window.location.href = '/';
          } else {
            alert('Nenhum dado em cache está disponível no momento.');
          }
        });
      } else {
        alert('Cache não suportado neste navegador.');
      }
    });

    // Auto-retry connection every 30 seconds
    setInterval(() => {
      if (navigator.onLine) {
        fetch('/', { method: 'HEAD', cache: 'no-cache' })
          .then(() => {
            window.location.href = '/';
          })
          .catch(() => {
            // Still offline or server unreachable
          });
      }
    }, 30000);
  </script>
</body>
</html>

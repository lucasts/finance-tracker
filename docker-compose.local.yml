# Local infrastructure only. Rails, Sidekiq and asset watchers run natively on the host via bin/dev.
# Usage: docker compose -f docker-compose.local.yml up -d
services:
  db:
    image: postgres:15
    container_name: finance_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orzeny_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orzeny_development"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: finance_tracker_redis
    ports:
      - "6379:6379"

volumes:
  pg_data:

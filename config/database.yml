# PostgreSQL configuration
# Dev/test connect to localhost (Docker container via docker-compose.yml).
# Production uses ENV variables.

default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: postgres
  password: postgres
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: orzeny_development

test:
  <<: *default
  database: orzeny_test

preprod:
  <<: *default
  database: orzeny_preprod
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

production:
  <<: *default
  database: orzeny_production
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
